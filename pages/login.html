<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập Tài Khoản — HanziQuizz</title>
    <meta
      name="description"
      content="Đăng nhập vào HanziQuizz để lưu tiến độ học tập, điểm số bài thi và đồng bộ flashcard từ vựng tiếng Trung."
    />
    <meta name="theme-color" content="#b33939" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HanziQuizz" />
    <link rel="apple-touch-icon" href="/static/img/icons/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      href="/static/img/HanziQuizz-Favicon.png"
    />
    <link rel="stylesheet" href="/static/css/game/theme.css?v={{ v }}" />
    <style>
      .auth-page {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        padding: var(--s-5) var(--s-4);
      }

      .auth-card {
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-lg);
        padding: var(--s-6) var(--s-5);
        box-shadow: var(--shadow-2);
      }

      .auth-logo {
        text-align: center;
        margin-bottom: var(--s-5);
      }

      .auth-logo img {
        height: 48px;
        width: auto;
        object-fit: contain;
        margin-bottom: var(--s-2);
      }

      .auth-logo h1 {
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--text);
      }

      .auth-logo p {
        color: var(--text-2);
        font-size: var(--fs-xs);
        margin-top: 2px;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: var(--s-3);
        margin: var(--s-4) 0;
        color: var(--text-3);
        font-size: var(--fs-xs);
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .btn-google {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--s-2);
        min-height: 44px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-sm);
        color: var(--text);
        font-family: var(--font-ui);
        font-size: var(--fs-sm);
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 150ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .btn-google:hover {
        background: var(--surface-2);
      }

      .google-icon {
        width: 18px;
        height: 18px;
      }

      .auth-footer {
        text-align: center;
        margin-top: var(--s-5);
        font-size: var(--fs-xs);
        color: var(--text-2);
      }
      .auth-footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .auth-footer a:hover {
        text-decoration: underline;
      }

      .error-msg {
        background: var(--danger-soft);
        border: 1px solid var(--danger);
        border-radius: var(--r-sm);
        padding: var(--s-2) var(--s-3);
        color: var(--danger);
        font-size: var(--fs-xs);
        margin-bottom: var(--s-4);
        display: none;
      }
      .error-msg.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <img src="/static/img/HanziQuizz-Favicon.png" alt="HanziQuizz Logo" />
          <h1>Đăng nhập</h1>
          <p>Học chữ Hán mỗi ngày 10 phút</p>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username" class="form-label">Tên đăng nhập</label>
            <input
              id="username"
              type="text"
              class="form-input"
              placeholder="Nhập tên đăng nhập"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-group">
            <label for="password" class="form-label">Mật khẩu</label>
            <input
              id="password"
              type="password"
              class="form-input"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
              required
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-full"
            style="margin-top: var(--s-3)"
          >
            Đăng nhập
          </button>
        </form>

        <div class="divider">hoặc</div>

        <a href="/api/v1/auth/google" class="btn-google" id="googleBtn">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          Đăng nhập với Google
        </a>

        <div class="auth-footer">
          Chưa có tài khoản?
          <a href="/pages/register.html">Đăng ký</a>
        </div>
      </div>
    </div>

    <script src="/static/js/core/api.js?v={{ v }}"></script>
    <script src="/static/js/core/auth.js?v={{ v }}"></script>
    <script src="/static/js/components/toast.js?v={{ v }}"></script>
    <script>
      (function () {
        const form = document.getElementById("loginForm");
        const errMsg = document.getElementById("errorMsg");

        function showError(msg) {
          errMsg.textContent = msg;
          errMsg.classList.add("show");
        }
        function hideError() {
          errMsg.classList.remove("show");
        }

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          hideError();

          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;

          if (!username || !password) {
            showError("Vui lòng nhập đầy đủ thông tin.");
            return;
          }

          try {
            const res = await Api.post("/auth/login", { username, password });
            Auth.setSession(res.access_token, {
              id: res.user_id,
              username: res.username,
              full_name: res.full_name,
              is_admin: res.is_admin,
            });
            window.location.href = "/";
          } catch (err) {
            showError(err.message || "Đăng nhập thất bại.");
          }
        });

        // Google OAuth Callback
        const hash = window.location.hash;
        if (hash.includes("token=")) {
          const params = new URLSearchParams(
            hash.replace("#/auth/callback?", "").replace("#", ""),
          );
          const token = params.get("token");
          if (token) {
            ApiUtils.setToken(token);
            Api.get("/auth/me")
              .then((user) => {
                Auth.setSession(token, {
                  id: user.id,
                  username: user.username,
                  full_name: user.full_name,
                  is_admin: user.is_admin,
                });
                window.location.href = "/";
              })
              .catch(() => {
                showError("Đăng nhập Google thất bại.");
              });
          }
        }
      })();
    </script>
    <script src="/static/js/pwa.js?v={{ v }}"></script>
  </body>
</html>
