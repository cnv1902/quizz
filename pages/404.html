<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Không tìm thấy trang · HanziQuizz</title>
    <meta name="description" content="Trang bạn tìm kiếm không tồn tại hoặc bạn không có quyền truy cập." />
    <link rel="icon" type="image/png" href="/static/img/HanziQuizz-Favicon.png" />
    <link rel="stylesheet" href="/static/css/game/theme.css?v={{ v }}" />
    <style>
      .error-layout {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
      }

      .error-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--s-6) var(--s-4);
      }

      .error-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: clamp(24px, 5vw, 44px) clamp(20px, 4vw, 36px);
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: var(--shadow-2);
        animation: cardPop 250ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes cardPop {
        from {
          opacity: 0;
          transform: scale(0.96) translateY(10px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .error-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 14px;
        background: rgba(244, 63, 94, 0.12);
        color: #f43f5e;
        border: 1px solid rgba(244, 63, 94, 0.25);
        border-radius: var(--r-full);
        font-size: 0.82rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: var(--s-4);
      }

      .error-code {
        font-size: clamp(3.5rem, 12vw, 5.5rem);
        font-weight: 900;
        line-height: 1;
        color: var(--text);
        letter-spacing: -0.04em;
        margin-bottom: var(--s-2);
        background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .error-title {
        font-size: clamp(1.2rem, 3.5vw, 1.45rem);
        font-weight: 700;
        color: var(--text);
        margin-bottom: var(--s-2);
      }

      .error-desc {
        font-size: var(--fs-sm);
        color: var(--text-2);
        line-height: 1.55;
        margin-bottom: var(--s-6);
      }

      .error-actions {
        display: flex;
        flex-direction: column;
        gap: var(--s-2);
      }

      @media (min-width: 480px) {
        .error-actions {
          flex-direction: row;
          justify-content: center;
        }
        .error-actions .btn {
          flex: 1;
        }
      }
    </style>
  </head>
  <body class="error-layout">
    <nav class="navbar" style="position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border);">
      <a href="/" class="navbar-brand">
        <img src="/static/img/HanziQuizz-Favicon.png" alt="HanziQuizz Logo" />
        <span>HanziQuizz</span>
      </a>
      <div class="navbar-nav">
        <a href="/" class="btn btn-ghost btn-sm">Trang chủ</a>
      </div>
    </nav>

    <main class="error-container">
      <div class="error-card">
        <div class="error-badge">
          <span>⚠️ 404 &middot; Quyền truy cập</span>
        </div>
        <div class="error-code">404</div>
        <h1 class="error-title">Không tìm thấy hoặc không có quyền</h1>
        <p class="error-desc">
          Trang bạn đang truy cập không tồn tại, đường dẫn đã thay đổi hoặc tài khoản của bạn không có quyền Quản trị viên (Admin) để sử dụng chức năng này.
        </p>

        <div class="error-actions">
          <a href="/" class="btn btn-primary">
            🏠 Về trang chủ
          </a>
          <a href="/pages/login.html" class="btn btn-secondary">
            🔑 Đăng nhập Quản trị
          </a>
        </div>

        <div style="margin-top: var(--s-4);">
          <a href="javascript:history.back()" style="font-size: var(--fs-xs); color: var(--text-2); text-decoration: none;">
            ← Quay lại trang trước
          </a>
        </div>
      </div>
    </main>

    <script src="/static/js/core/auth.js?v={{ v }}"></script>
    <script src="/static/js/components/navbar.js?v={{ v }}"></script>
  </body>
</html>
