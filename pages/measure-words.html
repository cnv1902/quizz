<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sổ Tay Lượng Từ Tiếng Trung HSK Thông Dụng — HanziQuizz</title>
    <meta
      name="description"
      content="Tra cứu danh sách lượng từ tiếng Trung thông dụng, phân loại danh từ đi kèm, câu ví dụ có phiên âm Pinyin và dịch nghĩa tiếng Việt."
    />
    <meta name="theme-color" content="#b33939" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HanziQuizz" />
    <link rel="apple-touch-icon" href="/static/img/icons/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      href="/static/img/HanziQuizz-Favicon.png"
    />
    <link rel="stylesheet" href="/static/css/game/theme.css?v={{ v }}" />
    <style>
      /* Layout Container đồng nhất index.html (§5.2) */
      .app-container {
        max-width: 1120px;
        margin: 0 auto;
        padding: var(--s-6) var(--s-5);
      }

      .welcome-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: var(--s-4);
        margin-bottom: var(--s-6);
        padding-bottom: var(--s-5);
        border-bottom: 1px solid var(--border);
      }

      .welcome-title {
        font-size: var(--fs-h1);
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.02em;
        margin-bottom: var(--s-1);
      }

      .welcome-sub {
        font-size: var(--fs-sm);
        color: var(--text-2);
      }

      /* Section Header & Search Box đồng nhất index.html */
      .section-header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s-4);
        margin-bottom: var(--s-5);
        flex-wrap: wrap;
      }

      .section-title {
        font-size: var(--fs-h2);
        font-weight: 600;
        color: var(--text);
        margin: 0;
      }

      .search-box {
        position: relative;
        display: flex;
        align-items: center;
        min-width: 260px;
      }

      .search-icon-svg {
        position: absolute;
        left: var(--s-3);
        color: var(--text-2);
        pointer-events: none;
      }

      .search-input-field {
        width: 100%;
        padding: var(--s-2) var(--s-3) var(--s-2) var(--s-7);
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        background: var(--surface);
        color: var(--text);
        font-family: var(--font-ui);
        font-size: var(--fs-sm);
        outline: none;
        transition: border-color 150ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .search-input-field:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      /* View Toggle */
      .view-toggle {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        overflow: hidden;
      }

      .view-toggle button {
        background: var(--surface-2);
        border: none;
        padding: var(--s-2) var(--s-3);
        font-size: var(--fs-xs);
        font-weight: 500;
        color: var(--text-2);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 120ms ease, background-color 120ms ease;
      }

      .view-toggle button.active {
        background: var(--surface);
        color: var(--accent);
        font-weight: 600;
      }

      /* Card Grid View */
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: var(--s-4);
      }

      .cards-grid.is-empty {
        display: block;
        width: 100%;
      }

      .empty-state {
        text-align: center;
        padding: var(--s-8) var(--s-4);
        background: var(--surface);
        border: 1px dashed var(--border-strong);
        border-radius: var(--r-md);
        width: 100%;
        max-width: 600px;
        margin: var(--s-4) auto;
        box-sizing: border-box;
      }

      .mw-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        padding: var(--s-5);
        display: flex;
        flex-direction: column;
        gap: var(--s-3);
        transition:
          border-color 150ms cubic-bezier(0.2, 0.7, 0.2, 1),
          transform 150ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .mw-card:hover {
        border-color: var(--border-strong);
        transform: translateY(-1px);
      }

      .mw-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: var(--s-3);
        border-bottom: 1px dashed var(--border);
      }

      .mw-hanzi-group {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }

      .mw-hanzi {
        font-family: var(--font-han, "Noto Serif SC", serif);
        font-size: 2.2rem;
        font-weight: 700;
        color: var(--accent);
        line-height: 1;
      }

      .mw-pinyin {
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--text);
      }

      .btn-audio {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-2);
        transition: color 120ms ease, background-color 120ms ease, border-color 120ms ease;
      }

      .btn-audio:hover {
        color: var(--accent);
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .mw-card-body {
        font-size: var(--fs-sm);
        color: var(--text);
        line-height: 1.65;
        flex: 1;
      }

      .rich-html-content {
        color: inherit;
        line-height: 1.6;
        font-size: var(--fs-sm);
        word-break: break-word;
      }
      .rich-html-content div {
        font-family: inherit !important;
        color: inherit !important;
      }
      .rich-html-content p {
        margin: 0 0 6px 0;
        line-height: 1.6;
        color: inherit;
      }
      .rich-html-content p:last-child {
        margin-bottom: 0;
      }
      .rich-html-content b,
      .rich-html-content strong {
        font-weight: 600;
        color: var(--text, inherit);
      }
      .rich-html-content i,
      .rich-html-content em {
        font-style: italic;
      }
      .rich-html-content ul,
      .rich-html-content ol {
        margin: 4px 0 8px 0;
        padding-left: 20px;
      }
      .rich-html-content ul {
        list-style-type: disc !important;
      }
      .rich-html-content ol {
        list-style-type: decimal !important;
      }
      .rich-html-content li {
        margin-bottom: 3px;
        line-height: 1.5;
        color: inherit;
      }
      .rich-html-content code {
        background: var(--surface-2);
        padding: 2px 6px;
        border-radius: 4px;
        color: var(--accent);
        border: 1px solid var(--border);
        font-size: 0.9em;
      }

      .mw-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: var(--fs-xs);
        color: var(--text-2);
        padding-top: var(--s-2);
        border-top: 1px solid var(--border);
      }

      /* Table View */
      .table-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        overflow-x: auto;
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--fs-sm);
        text-align: left;
      }

      .data-table th {
        background: var(--surface-2);
        padding: var(--s-3) var(--s-4);
        font-weight: 600;
        color: var(--text-2);
        font-size: var(--fs-xs);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }

      .data-table td {
        padding: var(--s-4);
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      .data-table tr:last-child td {
        border-bottom: none;
      }

      .data-table tr:hover td {
        background: rgba(0, 0, 0, 0.015);
      }

      .empty-state {
        text-align: center;
        padding: var(--s-7) var(--s-4);
        background: var(--surface);
        border: 1px dashed var(--border-strong);
        border-radius: var(--r-md);
        grid-column: 1 / -1;
      }

      /* === Responsive 3 Thiết bị: Mobile, Tablet, Desktop === */
      @media (max-width: 640px) {
        .app-container {
          padding: 12px 10px 32px;
        }
        .welcome-bar {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
        .welcome-title {
          font-size: 1.5rem;
        }
        .section-header-bar {
          flex-direction: column;
          align-items: stretch;
          gap: 10px;
        }
        .search-box {
          width: 100%;
          min-width: unset;
        }
        .cards-grid {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .mw-card {
          padding: 14px 12px;
        }
        .mw-hanzi {
          font-size: 1.8rem;
        }
      }

      @media (min-width: 641px) and (max-width: 1024px) {
        .app-container {
          padding: 20px 16px;
        }
        .cards-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar đồng nhất 100% index.html -->
    <nav class="navbar" style="position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border);">
      <div style="display: flex; align-items: center; gap: var(--s-4);">
        <a href="/" class="navbar-brand">
          <img src="/static/img/HanziQuizz-Favicon.png" alt="HanziQuizz Logo" />
          <span>HanziQuizz</span>
        </a>
        <div class="nav-links-wrap" style="display: flex; align-items: center; gap: var(--s-2);">
          <a href="/" class="btn btn-ghost btn-sm">Học từ</a>
          <a href="/pages/measure-words.html" class="btn btn-ghost btn-sm" style="color:var(--accent); font-weight:600;">Lượng từ</a>
          <a href="/pages/grammar.html" class="btn btn-ghost btn-sm">Ngữ pháp</a>
          <a href="/pages/custom-speech.html" class="btn btn-ghost btn-sm">Đọc văn bản</a>
        </div>
      </div>
      <div class="navbar-nav" id="navActions">
        <!-- Injected by JS -->
      </div>
    </nav>

    <main class="app-container">
      <!-- 1. Tiêu đề trang (§5.2) -->
      <header class="welcome-bar">
        <div>
          <h1 class="welcome-title">Cẩm nang Lượng từ tiếng Trung</h1>
          <p class="welcome-sub">
            Tra cứu và học cách sử dụng chính xác các lượng từ trong tiếng Hán.
          </p>
        </div>
        <div id="adminActionWrap" style="display: none;">
          <a href="/pages/admin/measure-words.html" class="btn btn-secondary btn-sm">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px; vertical-align:-2px;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Quản trị lượng từ
          </a>
        </div>
      </header>

      <!-- 2. Thanh tìm kiếm và bộ lọc -->
      <section>
        <div class="section-header-bar">
          <div style="display: flex; align-items: baseline; gap: var(--s-2);">
            <h2 class="section-title">Danh sách lượng từ</h2>
            <span style="font-size: var(--fs-xs); color: var(--text-2);">
              (<strong id="itemCount" style="color: var(--text);">0</strong> mục)
            </span>
          </div>

          <div style="display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;">
            <div class="search-box">
              <svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              <input
                type="text"
                class="search-input-field"
                id="searchInput"
                placeholder="Tìm lượng từ, pinyin, nghĩa..."
              />
            </div>

            <div class="view-toggle">
              <button type="button" id="btnViewCards" class="active" title="Xem dạng thẻ">
                ▦ Thẻ
              </button>
              <button type="button" id="btnViewTable" title="Xem dạng bảng tra cứu">
                ▤ Bảng
              </button>
            </div>
          </div>
        </div>

        <!-- Container Grid View -->
        <div id="cardsView" class="cards-grid">
          <div class="skeleton" style="height: 160px; border-radius: var(--r-md);"></div>
          <div class="skeleton" style="height: 160px; border-radius: var(--r-md);"></div>
          <div class="skeleton" style="height: 160px; border-radius: var(--r-md);"></div>
        </div>

        <!-- Container Table View -->
        <div id="tableView" class="table-card" style="display: none;">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 50px; text-align: center;">STT</th>
                <th style="width: 140px;">Chữ Hán</th>
                <th style="width: 130px;">Pinyin</th>
                <th style="min-width: 320px;">Ý nghĩa & Ngữ cảnh sử dụng</th>
                <th style="width: 80px; text-align: center;">Phát âm</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="toast-container"></div>

    <script src="/static/js/core/api.js?v={{ v }}"></script>
    <script src="/static/js/core/auth.js?v={{ v }}"></script>
    <script src="/static/js/components/toast.js?v={{ v }}"></script>
    <script src="/static/js/components/audioPlayer.js?v={{ v }}"></script>
    <script src="/static/js/components/navbar.js?v={{ v }}"></script>
    <script>
      (function() {
        const user = Auth.getUser();
        let allItems = [];
        let filteredItems = [];

        function speak(text, audioUrl, btnElement) {
          AudioPlayer.play(audioUrl, text, { btnElement: btnElement });
        }

        function formatRichContent(content) {
          if (!content) return "";
          const str = String(content).trim();
          const hasHtml = /<\/?(?:div|p|b|strong|i|em|u|span|ul|ol|li|br|hr|code|pre)[^>]*>/i.test(str);
          if (hasHtml) {
            const clean = str
              .replace(/<\s*(?:script|iframe|object|embed|applet|meta|link)[^>]*>[\s\S]*?<\s*\/\s*(?:script|iframe|object|embed|applet|meta|link)\s*>/gi, "")
              .replace(/<\s*(?:script|iframe|object|embed|applet|meta|link)[^>]*\/?>/gi, "")
              .replace(/\s+on\w+\s*=\s*(?:'[^']*'|"[^"]*"|[^\s>]+)/gi, "")
              .replace(/javascript\s*:/gi, "disabled:");
            return `<div class="rich-html-content">${clean}</div>`;
          }
          let safe = escapeHtml(str);
          safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
          safe = safe.replace(/\n/g, '<br>');
          return `<div class="rich-html-content">${safe}</div>`;
        }

        function escapeHtml(str) {
          if (!str) return "";
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        // Render Navbar đồng nhất index.html
        function renderNav() {
          const nav = document.getElementById("navActions");
          const isAuth = Auth.isLoggedIn();
          const isAdmin = Auth.isAdmin();
          const userName = user?.full_name || user?.username || "Bạn";

          if (isAdmin) {
            document.getElementById("adminActionWrap").style.display = "block";
          }

          if (isAuth) {
            nav.innerHTML = `
              ${isAdmin ? `<a href="/pages/admin/quizzes.html" class="btn btn-ghost btn-sm" style="color:var(--text-2);">Quản trị</a>` : ""}
              <span style="color:var(--text-2); font-size:var(--fs-sm); font-weight:500;">${escapeHtml(userName)}</span>
              <button class="btn btn-ghost btn-sm" id="logoutBtn" title="Đăng xuất">Đăng xuất</button>
            `;
            document.getElementById("logoutBtn").addEventListener("click", () => {
              Auth.clearSession();
              window.location.reload();
            });
          } else {
            nav.innerHTML = `
              <a href="/pages/login.html" class="btn btn-secondary btn-sm">Đăng nhập</a>
              <a href="/pages/register.html" class="btn btn-primary btn-sm">Đăng ký</a>
            `;
          }
        }

        function render() {
          const cardsView = document.getElementById("cardsView");
          const tableBody = document.getElementById("tableBody");
          const countDisplay = document.getElementById("itemCount");

          countDisplay.textContent = filteredItems.length;

          if (filteredItems.length === 0) {
            cardsView.classList.add("is-empty");
            const emptyHtml = `
              <div class="empty-state">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-3); margin-bottom: var(--s-2);"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <h3 style="font-size: var(--fs-body); font-weight: 600; margin-bottom: var(--s-1);">Chưa có lượng từ nào</h3>
                <p style="font-size: var(--fs-sm); color: var(--text-2); margin: 0;">Dữ liệu lượng từ hiện đang trống hoặc không khớp với tìm kiếm.</p>
              </div>
            `;
            cardsView.innerHTML = emptyHtml;
            tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; border: none; padding: var(--s-6) 0;">${emptyHtml}</td></tr>`;
            return;
          }

          cardsView.classList.remove("is-empty");

          cardsView.innerHTML = filteredItems.map((item, idx) => `
            <div class="mw-card">
              <div class="mw-card-header">
                <div class="mw-hanzi-group">
                  <span class="mw-hanzi">${escapeHtml(item.hanzi)}</span>
                  <span class="mw-pinyin">${escapeHtml(item.pinyin || '')}</span>
                </div>
                <button type="button" class="btn-audio" data-speak="${escapeHtml(item.hanzi)}" data-audio="${escapeHtml(item.audio_url || '')}" title="Phát âm tiếng Trung">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  </svg>
                </button>
              </div>
              <div class="mw-card-body">
                ${formatRichContent(item.vietnamese)}
              </div>
              <div class="mw-card-footer">
                <span>#${idx + 1}</span>
                <span>Lượng từ</span>
              </div>
            </div>
          `).join("");

          tableBody.innerHTML = filteredItems.map((item, idx) => `
            <tr>
              <td style="text-align: center; color: var(--text-2); font-size: var(--fs-xs);">${idx + 1}</td>
              <td>
                <span style="font-family: var(--font-han); font-size: 1.4rem; font-weight: 700; color: var(--accent);">
                  ${escapeHtml(item.hanzi)}
                </span>
              </td>
              <td style="font-weight: 600; color: var(--text);">${escapeHtml(item.pinyin || '')}</td>
              <td style="line-height: 1.6; vertical-align: top;">${formatRichContent(item.vietnamese)}</td>
              <td style="text-align: center;">
                <button type="button" class="btn-audio" data-speak="${escapeHtml(item.hanzi)}" data-audio="${escapeHtml(item.audio_url || '')}" title="Phát âm">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  </svg>
                </button>
              </td>
            </tr>
          `).join("");

          document.querySelectorAll("[data-speak]").forEach(btn => {
            btn.onclick = () => {
              const text = btn.getAttribute("data-speak");
              const audioUrl = btn.getAttribute("data-audio");
              speak(text, audioUrl, btn);
            };
          });
        }

        function applyFilter() {
          const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
          if (!q) {
            filteredItems = [...allItems];
          } else {
            filteredItems = allItems.filter(item => {
              const h = (item.hanzi || "").toLowerCase();
              const p = (item.pinyin || "").toLowerCase();
              const v = (item.vietnamese || "").toLowerCase();
              return h.includes(q) || p.includes(q) || v.includes(q);
            });
          }
          render();
        }

        async function loadData() {
          try {
            const res = await Api.get("/measure-words");
            allItems = Array.isArray(res) ? res : (res.data || []);
            filteredItems = [...allItems];
            render();
          } catch (err) {
            console.error(err);
            Toast.show("Không thể tải danh sách lượng từ!", "danger");
          }
        }

        const btnCards = document.getElementById("btnViewCards");
        const btnTable = document.getElementById("btnViewTable");
        const cardsView = document.getElementById("cardsView");
        const tableView = document.getElementById("tableView");

        btnCards.addEventListener("click", () => {
          btnCards.classList.add("active");
          btnTable.classList.remove("active");
          cardsView.style.display = "grid";
          tableView.style.display = "none";
        });

        btnTable.addEventListener("click", () => {
          btnTable.classList.add("active");
          btnCards.classList.remove("active");
          cardsView.style.display = "none";
          tableView.style.display = "block";
        });

        document.getElementById("searchInput").addEventListener("input", applyFilter);

        renderNav();
        loadData();
      })();
    </script>
    <script src="/static/js/pwa.js?v={{ v }}"></script>
  </body>
</html>
