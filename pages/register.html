<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo tài khoản — HanziQuizz</title>
    <meta
      name="description"
      content="Tạo tài khoản HanziQuizz miễn phí để bắt đầu học tiếng Trung."
    />
    <link
      rel="icon"
      type="image/png"
      href="/static/img/HanziQuizz-Favicon.png"
    />
    <link rel="stylesheet" href="/static/css/game/theme.css?v={{ v }}" />
    <style>
      .auth-page {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        padding: var(--s-5) var(--s-4);
      }

      .auth-card {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-lg);
        padding: var(--s-6) var(--s-5);
        box-shadow: var(--shadow-2);
      }

      .auth-logo {
        text-align: center;
        margin-bottom: var(--s-5);
      }

      .auth-logo img {
        height: 48px;
        width: auto;
        object-fit: contain;
        margin-bottom: var(--s-2);
      }

      .auth-logo h1 {
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--text);
      }

      .auth-logo p {
        color: var(--text-2);
        font-size: var(--fs-xs);
        margin-top: 2px;
      }

      .row-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s-3);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: var(--s-3);
        margin: var(--s-4) 0;
        color: var(--text-3);
        font-size: var(--fs-xs);
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .btn-google {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--s-2);
        min-height: 44px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-sm);
        color: var(--text);
        font-family: var(--font-ui);
        font-size: var(--fs-sm);
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 150ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .btn-google:hover {
        background: var(--surface-2);
      }

      .auth-footer {
        text-align: center;
        margin-top: var(--s-5);
        font-size: var(--fs-xs);
        color: var(--text-2);
      }
      .auth-footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .auth-footer a:hover {
        text-decoration: underline;
      }

      .error-msg {
        background: var(--danger-soft);
        border: 1px solid var(--danger);
        border-radius: var(--r-sm);
        padding: var(--s-2) var(--s-3);
        color: var(--danger);
        font-size: var(--fs-xs);
        margin-bottom: var(--s-4);
        display: none;
      }
      .error-msg.show {
        display: block;
      }

      @media (max-width: 480px) {
        .row-2 {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <img src="/static/img/HanziQuizz-Favicon.png" alt="HanziQuizz Logo" />
          <h1>Tạo tài khoản</h1>
          <p>Bắt đầu học chữ Hán mỗi ngày</p>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <form id="registerForm">
          <div class="form-group">
            <label for="username" class="form-label">Tên đăng nhập</label>
            <input
              id="username"
              type="text"
              class="form-input"
              placeholder="Viết liền, không dấu"
              required
            />
          </div>

          <div class="row-2">
            <div class="form-group">
              <label for="fullName" class="form-label">Họ và tên</label>
              <input
                id="fullName"
                type="text"
                class="form-input"
                placeholder="Ví dụ: Minh Anh"
                required
              />
            </div>
            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input
                id="email"
                type="email"
                class="form-input"
                placeholder="name@example.com"
                required
              />
            </div>
          </div>

          <div class="row-2">
            <div class="form-group">
              <label for="password" class="form-label">Mật khẩu</label>
              <input
                id="password"
                type="password"
                class="form-input"
                placeholder="Ít nhất 6 ký tự"
                required
              />
            </div>
            <div class="form-group">
              <label for="confirmPassword" class="form-label">Xác nhận</label>
              <input
                id="confirmPassword"
                type="password"
                class="form-input"
                placeholder="Nhập lại mật khẩu"
                required
              />
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-full"
            style="margin-top: var(--s-3)"
          >
            Tạo tài khoản
          </button>
        </form>

        <div class="divider">hoặc</div>

        <a href="/api/v1/auth/google" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          Đăng ký với Google
        </a>

        <div class="auth-footer">
          Đã có tài khoản?
          <a href="/pages/login.html">Đăng nhập</a>
        </div>
      </div>
    </div>

    <script src="/static/js/core/api.js?v={{ v }}"></script>
    <script src="/static/js/core/auth.js?v={{ v }}"></script>
    <script>
      (function () {
        const form = document.getElementById("registerForm");
        const errMsg = document.getElementById("errorMsg");

        function showError(msg) {
          errMsg.textContent = msg;
          errMsg.classList.add("show");
        }
        function hideError() {
          errMsg.classList.remove("show");
        }

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          hideError();

          const username = document.getElementById("username").value.trim();
          const fullName = document.getElementById("fullName").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const confirm = document.getElementById("confirmPassword").value;

          if (password !== confirm) {
            showError("Mật khẩu xác nhận không khớp.");
            return;
          }

          try {
            const res = await Api.post("/auth/register", {
              username,
              full_name: fullName,
              email,
              password,
            });
            Auth.setSession(res.access_token, {
              id: res.user_id,
              username: res.username,
              full_name: res.full_name,
              is_admin: res.is_admin,
            });
            window.location.href = "/";
          } catch (err) {
            showError(err.message || "Đăng ký thất bại.");
          }
        });
      })();
    </script>
  </body>
</html>
